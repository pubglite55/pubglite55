<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-label="pubglite55 banner">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#0f1a34"/>
      <stop offset="100%" stop-color="#121d3f"/>
    </linearGradient>
    <linearGradient id="accD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0.86" cy="0.18" r="0.55">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD2" cx="0.05" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsD" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="ringD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0.5" y="0.5" width="799" height="209" rx="14" fill="url(#bgD)" stroke="#ffffff" stroke-opacity="0.10"/>
  <rect x="0.5" y="0.5" width="799" height="209" rx="14" fill="url(#dotsD)"/>
  <rect x="0.5" y="0.5" width="799" height="209" rx="14" fill="url(#glowD)"/>
  <rect x="0.5" y="0.5" width="799" height="209" rx="14" fill="url(#glowD2)"/>

  <!-- top left status pill -->
  <g transform="translate(34,30)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/>
    <circle cx="16" cy="13" r="4.5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="17" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="#4ade80">open to collab</text>
  </g>

  <!-- main title -->
  <text x="34" y="96" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="42" font-weight="700" fill="url(#accD)" letter-spacing="-1">pubglite55</text>
  <text x="34" y="126" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="15" fill="#8ea0c9" letter-spacing="0.3">&gt; xiuxiu391 --role="system-layer tinkerer"</text>

  <!-- divider -->
  <line x1="34" y1="146" x2="600" y2="146" stroke="url(#ringD)" stroke-width="2" stroke-linecap="round"/>

  <!-- chips -->
  <g transform="translate(34,160)" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11.5">
    <g>
      <rect x="0" y="0" width="126" height="24" rx="12" fill="#4f8cff" fill-opacity="0.14" stroke="#4f8cff" stroke-opacity="0.5"/>
      <text x="12" y="16" fill="#93c5fd"># kernel-exploit</text>
    </g>
    <g transform="translate(136,0)">
      <rect x="0" y="0" width="112" height="24" rx="12" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="12" y="16" fill="#67e8f9"># hackintosh</text>
    </g>
    <g transform="translate(258,0)">
      <rect x="0" y="0" width="128" height="24" rx="12" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="12" y="16" fill="#c4b5fd"># reverse-eng</text>
    </g>
  </g>

  <!-- right side decoration: concentric rings + nodes -->
  <g transform="translate(672,105)" opacity="0.95">
    <circle r="66" fill="none" stroke="url(#ringD)" stroke-width="1.2" stroke-opacity="0.35"/>
    <circle r="52" fill="none" stroke="url(#ringD)" stroke-width="1.2" stroke-opacity="0.55"/>
    <circle r="38" fill="none" stroke="url(#ringD)" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle r="26" fill="#0f1a34" stroke="url(#ringD)" stroke-width="2"/>
    <text text-anchor="middle" y="6" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" font-weight="700" fill="#22d3ee">0x55</text>
    <circle cx="0" cy="-66" r="3.5" fill="#4f8cff"/>
    <circle cx="58" cy="31" r="3" fill="#a78bfa"/>
    <circle cx="-58" cy="31" r="3" fill="#22d3ee"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
